# ============================================
# logging
# ============================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"
# ============================================
# netwokrs
# ============================================
networks:
  restricted_wan:
    external: true
# ============================================
# secrets
# ============================================
secrets:
  # gluetun reads these from the default paths
  # /run/secrets/openvpn_user and /run/secrets/openvpn_password
  openvpn_user:
    file: ${SECRETS}/openvpn_user
  openvpn_password:
    file: ${SECRETS}/openvpn_password
services:
  # ============================================
  # gluetun - VPN gateway
  # ============================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    logging: *default-logging
    hostname: gluetun
    networks:
      restricted_wan:
        ipv4_address: 172.20.30.90
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    secrets:
      - openvpn_user
      - openvpn_password
    environment:
      - LOG_LEVEL=info
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - UMASK_SET=${USER_MASK}
      - VPN_SERVICE_PROVIDER=private internet access
      - SERVER_REGIONS=${PIA_REGION}
    volumes:
      - ${CONFIG_ROOT:-.}/gluetun:/gluetun
    labels:
      - "traefik.enable=true"
      # seerr
      - "traefik.http.routers.seerr.service=seerr"
      - "traefik.http.routers.seerr.tls=true"
      - "traefik.http.routers.seerr.tls.certresolver=cloudflare"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      # radarr
      - "traefik.http.routers.radarr.service=radarr"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.1"
  # ============================================
  # jellyfin - media server
  # ============================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    logging: *default-logging
    hostname: jellyfin
    networks:
      restricted_wan:
        ipv4_address: 172.20.30.50
    ports:
      - "7359:7359/udp" # Client discovery (auto-detect on LAN)
      - "1900:1900/udp" # DLNA
    environment:
      - LOG_LEVEL=info
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${DOMAIN}
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - UMASK_SET=${USER_MASK}
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    group_add:
      - 105
    volumes:
      - ${CONFIG_ROOT:-.}/jellyfin:/config:rw
      - ${CONFIG_ROOT:-.}/jellyfin/cache:/cache:rw
      - ${MEDIA_SHARE}/media:/media:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.service=jellyfin"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
    devices:
      - /dev/dri:/dev/dri
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    security_opt:
      - no-new-privileges:true
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "3.0"
  # ============================================
  # seerr - request portal
  # ============================================
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    logging: *default-logging
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - UMASK_SET=${USER_MASK}
      - PORT=5055
      - APP_URL=https://seerr.${DOMAIN}
    volumes:
      - ${CONFIG_ROOT:-.}/seerr:/app/config
    security_opt:
      - no-new-privileges:true
    restart: "unless-stopped"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
  # ============================================
  # sonarr - tv show monitor
  # ============================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    logging: *default-logging
    hostname: sonarr
    networks:
      restricted_wan:
        ipv4_address: 172.20.30.40
    environment:
      - LOG_LEVEL=info
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - UMASK_SET=${USER_MASK}
    volumes:
      - ${CONFIG_ROOT:-.}/sonarr:/config
      - ${MEDIA_SHARE}/media:/media:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.service=sonarr"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.tls.certresolver=cloudflare"
    security_opt:
      - no-new-privileges:true
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8989/sonarr/ping"]
      interval: 1m
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.1"
  # ============================================
  # radarr - movie monitor
  # ============================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    logging: *default-logging
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - UMASK_SET=${USER_MASK}
    volumes:
      - ${CONFIG_ROOT:-.}/radarr:/config
      - ${MEDIA_SHARE}/media:/media:rw
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:7878"]
      interval: 2m
      timeout: 15s
      retries: 2
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.1"
  # ============================================
  # prowlarr - indexer manager
  # ============================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    logging: *default-logging
    hostname: prowlarr
    networks:
      restricted_wan:
        ipv4_address: 172.20.30.30
    environment:
      - LOG_LEVEL=info
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - UMASK_SET=${USER_MASK}
    volumes:
      - ${CONFIG_ROOT:-.}/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    security_opt:
      - no-new-privileges:true
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9696/ping"]
      interval: 2m
      timeout: 15s
      retries: 2
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
  # ============================================
  # qbittorrent - torrent download client
  # ============================================
  qbit:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbit
    logging: *default-logging
    hostname: qbit
    networks:
      restricted_wan:
        ipv4_address: 172.20.30.60
    environment:
      - LOG_LEVEL=info
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - UMASK_SET=${USER_MASK}
      - WEBUI_PORT=8085
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - ${CONFIG_ROOT:-.}/qbit:/config
      - ${MEDIA_SHARE}/media:/media:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbit.service=qbit"
      - "traefik.http.routers.qbit.tls=true"
      - "traefik.http.routers.qbit.entrypoints=websecure"
      - "traefik.http.routers.qbit.rule=Host(`qbit.${DOMAIN}`)"
      - "traefik.http.services.qbit.loadbalancer.server.port=8085"
      - "traefik.http.routers.qbit.tls.certresolver=cloudflare"
    security_opt:
      - no-new-privileges:true
    restart: "unless-stopped"
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8085"]
      interval: 1m
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.1"
  # ============================================
  # byparr - cloudflare challenge solver (flaresolverr drop-in)
  # ============================================
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    logging: *default-logging
    hostname: byparr
    networks:
      restricted_wan:
        ipv4_address: 172.20.30.66
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE}
      - BROWSER_LOCALE=ru-RU
      - BROWSER_TIMEZONE=${TIMEZONE}
    # Chromium needs a large /dev/shm and an exec-capable /tmp
    shm_size: "1gb"
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
    security_opt:
      - no-new-privileges:true
    restart: "unless-stopped"
    # Cheap liveness probe - /health launches a real browser and hits google.com
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8191/docs"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
  # ============================================
  # configarr - declarative Prowlarr wiring (one-shot)
  # ============================================
  configarr:
    image: ghcr.io/raydak-labs/configarr:1.39.2
    container_name: configarr
    logging: *default-logging
    networks:
      restricted_wan:
        ipv4_address: 172.20.30.67
    # One-shot job: starts with the stack, syncs, then exits
    depends_on:
      prowlarr:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE}
      # Read from arr/.env (next to this compose file)
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RUTRACKER_USER=${RUTRACKER_USER:-}
      - RUTRACKER_PASS=${RUTRACKER_PASS:-}
      - KINOZAL_USER=${KINOZAL_USER:-}
      - KINOZAL_PASS=${KINOZAL_PASS:-}
      - RUDUB_USER=${RUDUB_USER:-}
      - RUDUB_PASS=${RUDUB_PASS:-}
      - RUSTORKA_COOKIE=${RUSTORKA_COOKIE:-}
      - DRY_RUN=${DRY_RUN:-false}
    volumes:
      # Declarative config, versioned in the repo
      - ./configarr:/app/config:ro
      # Runtime clone cache, lives with the other app data
      - ${CONFIG_ROOT:-.}/configarr/repos:/app/repos
    security_opt:
      - no-new-privileges:true
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
